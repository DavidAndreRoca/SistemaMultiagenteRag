name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisis:
    name: Análisis (Ruff)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade "pip>=26.2" && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  tipado:
    name: Tipado (mypy estricto)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade "pip>=26.2" && pip install -e ".[dev]"
      - run: mypy

  pruebas:
    name: Pruebas y cobertura (PostgreSQL con pgvector)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      bd:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sma
          POSTGRES_PASSWORD: sma_ci
          POSTGRES_DB: sma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sma -d sma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENTORNO: pruebas
      URL_BD: postgresql+psycopg://sma:sma_ci@localhost:5432/sma
      URL_BD_PRUEBAS: postgresql+psycopg://sma:sma_ci@localhost:5432/sma
      SECRETO_SESION: secreto-solo-para-pruebas-automaticas-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade "pip>=26.2" && pip install -e ".[dev]"
      - name: Crear la extensión vector
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://sma:sma_ci@localhost:5432/sma", autocommit=True) as c:
              c.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY
      - name: Migraciones al día con los modelos
        env:
          URL_BD: postgresql+psycopg://sma:sma_ci@localhost:5432/sma
        run: alembic upgrade head && alembic check
      # Ninguna prueba de CI llama a un modelo real (apartado 4.7); `modelo_real` queda fuera.
      - name: Pruebas con cobertura mínima de 70 %
        run: pytest -m "not modelo_real" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: backend/coverage.xml

  dependencias:
    name: Escaneo de dependencias (pip-audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pip>=26.2" && pip install -e ".[dev]"
      - run: pip-audit --local --skip-editable
      # npm audit se añade cuando exista frontend/ (T13).

  # T08. Sin pesos ni PyTorch: el contrato se prueba con motores de prueba; las pruebas con
  # los pesos reales (marca modelos_locales) se ejecutan bajo demanda en el servidor.
  servicio_modelos:
    name: Servicio de modelos (análisis, tipado, pruebas y dependencias)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: servicio_modelos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servicio_modelos/pyproject.toml
      - run: python -m pip install --upgrade "pip>=26.2" && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Pruebas con cobertura mínima de 70 %
        run: pytest -m "not modelos_locales" --cov
      - name: Escaneo de dependencias instaladas
        run: pip-audit --local --skip-editable
      # Sin la etiqueta local "+cpu", que PyPI no conoce, torch también se audita.
      - name: Escaneo del árbol fijado de inferencia (torch, transformers)
        run: |
          sed 's/+cpu//' restricciones.txt > "$RUNNER_TEMP/restricciones.txt"
          pip-audit --requirement "$RUNNER_TEMP/restricciones.txt" --no-deps --disable-pip

  # T09. Canal de PDF con Docling y el tokenizador de bge-m3 reales sobre los PDF de
  # muestra; GROBID con sus respuestas grabadas. Árbol fijado con PyTorch en CPU. Los
  # recursos (modelo de diseño de página y tokenizador) se descargan con revisión y huella
  # fijadas y se guardan en caché.
  # T10: la ingesta de los PDF de muestra con el canal real y la base real (CP-21).
  corpus:
    name: Canal de PDF (Docling, tokenizador y dependencias)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      bd:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sma
          POSTGRES_PASSWORD: sma_ci
          POSTGRES_DB: sma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sma -d sma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DIRECTORIO_RECURSOS_CORPUS: /tmp/recursos-corpus
      ENTORNO: pruebas
      URL_BD: postgresql+psycopg://sma:sma_ci@localhost:5432/sma
      URL_BD_PRUEBAS: postgresql+psycopg://sma:sma_ci@localhost:5432/sma
      SECRETO_SESION: secreto-solo-para-pruebas-automaticas-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/restricciones-corpus.txt
      - name: Instalar la API con el extra corpus y el árbol fijado
        run: |
          python -m pip install --upgrade "pip>=26.2"
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -c restricciones-corpus.txt -e ".[dev,corpus]"
      - uses: actions/cache@v4
        with:
          path: /tmp/recursos-corpus
          key: recursos-corpus-${{ hashFiles('backend/app/corpus/recursos.py') }}
      - name: Descargar y verificar los recursos del canal
        run: python -m app.corpus.recursos "$DIRECTORIO_RECURSOS_CORPUS"
      - name: Crear la extensión vector
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://sma:sma_ci@localhost:5432/sma", autocommit=True) as c:
              c.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY
      - name: Pruebas del canal y de la ingesta con Docling real
        run: pytest -m corpus pruebas/integracion/test_canal_pdf.py pruebas/integracion/test_corpus_real.py
      # Sin la etiqueta local "+cpu", que PyPI no conoce, torch también se audita.
      - name: Escaneo del árbol fijado (Docling, torch, transformers)
        run: |
          sed 's/+cpu//' restricciones-corpus.txt > "$RUNNER_TEMP/restricciones-corpus.txt"
          pip-audit --requirement "$RUNNER_TEMP/restricciones-corpus.txt" --no-deps --disable-pip

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Se usa la imagen oficial y no la acción, que exige licencia en organizaciones.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --no-banner
