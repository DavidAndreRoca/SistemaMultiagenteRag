# Servicios de desarrollo. Cada integrante usa su propio COMPOSE_PROJECT_NAME y puertos
# (ver .env.example). GROBID y el servicio de modelos van en un proyecto "compartido" (T08).
services:
  bd:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-sma}
    ports:
      - "127.0.0.1:${PUERTO_BD:-5432}:5432"
    volumes:
      - datos_bd:/var/lib/postgresql/data
      - ./docker/postgres/01-extension-vector.sql:/docker-entrypoint-initdb.d/01-extension-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Aplica las migraciones de Alembic y termina; la API espera a que acabe bien.
  migrar:
    build:
      context: ./backend
      target: ejecucion
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      bd:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: ejecucion
    env_file: .env
    # Corpus (T10): recursos del canal (solo lectura) y PDF guardados. Para que la API
    # alcance GROBID y el servicio de modelos, sume docker-compose.corpus.yml (README).
    environment:
      DIRECTORIO_RECURSOS_CORPUS: /recursos
      DIRECTORIO_ARCHIVOS: /archivos
    volumes:
      - recursos_corpus:/recursos:ro
      - archivos:/archivos
    depends_on:
      bd:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PUERTO_API:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # docker compose run --rm --build pruebas   (usa un entorno propio, no necesita claves externas)
  pruebas:
    profiles: ["pruebas"]
    build:
      context: ./backend
      target: pruebas
    volumes:
      - ./docs:/docs:ro  # el diccionario de datos versionado se compara con los modelos
      # Recursos del canal de PDF (T09). Se llenan una vez con:
      # docker compose run --rm --no-deps pruebas python -m app.corpus.recursos /recursos
      - recursos_corpus:/recursos
    environment:
      ENTORNO: pruebas
      DIRECTORIO_RECURSOS_CORPUS: /recursos
      URL_BD: postgresql+psycopg://${POSTGRES_USER:-sma}:${POSTGRES_PASSWORD:-x}@bd:5432/${POSTGRES_DB:-sma}
      URL_BD_PRUEBAS: postgresql+psycopg://${POSTGRES_USER:-sma}:${POSTGRES_PASSWORD:-x}@bd:5432/${POSTGRES_DB:-sma}
      SECRETO_SESION: secreto-solo-para-pruebas-automaticas-0123456789
    depends_on:
      bd:
        condition: service_healthy

volumes:
  datos_bd:
  recursos_corpus:
  archivos:
