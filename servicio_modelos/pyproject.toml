[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "servicio-modelos"
version = "0.1.0"
description = "Servicio compartido de embeddings (bge-m3) y reranking (bge-reranker-v2-m3) en CPU (T08)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
# Inferencia (decisión T08-01). torch se instala desde el índice de CPU de PyTorch
# (ver Dockerfile); las versiones exactas de todo el árbol están en restricciones.txt.
inferencia = [
    "torch==2.14.1",
    "transformers==5.20.2",
    "huggingface-hub==2.2.0",
    "numpy>=2,<3",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["servicio*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["servicio"]

[[tool.mypy.overrides]]
# Bibliotecas de inferencia: sin tipos completos y ausentes en la integración continua.
module = ["torch", "torch.*", "transformers", "transformers.*", "huggingface_hub", "huggingface_hub.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["pruebas"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "modelos_locales: carga los pesos reales de los modelos (DIRECTORIO_MODELOS); solo bajo demanda",
]

[tool.coverage.run]
source = ["servicio"]
branch = true
# El motor real y la descarga se prueban con modelos_locales, no en la integración continua.
omit = ["servicio/motor_transformers.py", "servicio/descargar.py", "servicio/__main__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
