[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-multiagente-rag"
version = "0.1.0"
description = "Sistema multiagente con RAG para la asistencia en la produccion de articulos cientificos empiricos (UTP, Ica)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0.32,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "pgvector>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"pruebas/**" = ["B018"]
"migraciones/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integracion: requiere PostgreSQL real (URL_BD_PRUEBAS)",
    "modelo_real: llama a un modelo de lenguaje real; solo bajo demanda, nunca en la integracion continua",
    "servicios_compartidos: usa el servicio de modelos real (URL_SERVICIO_MODELOS_PRUEBAS); solo bajo demanda",
]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
